<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="120" fill="#0f0a1e"/>
  <!-- Thick orbit ring (back layer, dark purple) -->
  <ellipse cx="256" cy="256" rx="193" ry="68" fill="none" stroke="#4c1d95" stroke-width="45"/>
  <!-- Central planet -->
  <circle cx="256" cy="256" r="114" fill="#7c3aed"/>
  <!-- Thin bright orbit ring (front layer) -->
  <ellipse cx="256" cy="256" rx="193" ry="68" fill="none" stroke="#a78bfa" stroke-width="14"/>
  <!-- Small satellite dot on the ring -->
  <circle cx="449" cy="256" r="18" fill="#c4b5fd"/>
</svg>
