<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b4de8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#orbitGrad)" stroke-width="8" opacity="0.4"/>
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#orbitGrad)" stroke-width="6" opacity="0.65"/>
  <!-- Inner filled circle -->
  <circle cx="100" cy="100" r="34" fill="url(#orbitGrad)"/>
  <!-- Orbit dot -->
  <circle cx="100" cy="10" r="10" fill="#7c6af7"/>
</svg>
